<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>포카보카 아이콘 후보 B3</title>
<style>
body{margin:0;background:#2b2b30;font-family:"Malgun Gothic",sans-serif;color:#eee;padding:28px;width:1700px}
h1{font-size:26px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.c{background:#1c1c20;border-radius:18px;padding:18px}
.c h2{font-size:19px;margin:0 0 4px}.c p{font-size:13px;color:#aaa;margin:0 0 14px;line-height:1.45;height:38px}
.row{display:flex;align-items:flex-end;gap:14px}
.big svg{width:220px;height:220px;display:block;border-radius:48px;overflow:hidden}
.side{display:flex;flex-direction:column;gap:12px;align-items:center}
.circ svg{width:84px;height:84px;border-radius:50%;display:block}
.home{width:140px;height:120px;border-radius:14px;background:linear-gradient(160deg,#7a8fb8,#c9a38a);display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:8px;box-sizing:border-box}
.home span{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.35)}
.home svg{width:40px;height:40px;border-radius:11px;display:block}
</style></head><body>
<h1>B3 변형 — 창 안에 무엇을 넣을까</h1>
<div class="grid" id="g"></div>
<svg width="0" height="0" style="position:absolute">
<defs>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fd0"/><stop offset=".3" stop-color="#8ff3ff"/><stop offset=".55" stop-color="#fff38f"/><stop offset=".8" stop-color="#c39bff"/><stop offset="1" stop-color="#ff9ad5"/></linearGradient>
  <linearGradient id="holo2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ef0ff"/><stop offset=".35" stop-color="#d8a8ff"/><stop offset=".7" stop-color="#ffb3d9"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset=".28" stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset=".56" stop-color="#fff" stop-opacity=".7"/><stop offset=".66" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2635"/><stop offset="1" stop-color="#121117"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1a3a"/><stop offset="1" stop-color="#0d0c14"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A4C"/><stop offset="1" stop-color="#EE4E14"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f78"/><stop offset="1" stop-color="#ff7a5a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#fff1c2"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#b98bff" stop-opacity=".55"/><stop offset="1" stop-color="#b98bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowO" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#FF6A2E" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A2E" stop-opacity="0"/></radialGradient>
  <pattern id="lines" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="14" height="14" fill="none"/><rect width="5" height="14" fill="#fff" opacity=".18"/></pattern>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <clipPath id="card"><rect x="136" y="80" width="240" height="336" rx="28"/></clipPath>
</defs></svg>
<script>
const spark=(x,y,r,o=1)=>`<path d="M${x} ${y-r}C${x+r*.12} ${y-r*.12} ${x+r*.12} ${y-r*.12} ${x+r} ${y}C${x+r*.12} ${y+r*.12} ${x+r*.12} ${y+r*.12} ${x} ${y+r}C${x-r*.12} ${y+r*.12} ${x-r*.12} ${y+r*.12} ${x-r} ${y}C${x-r*.12} ${y-r*.12} ${x-r*.12} ${y-r*.12} ${x} ${y-r}Z" fill="#fff" opacity="${o}"/>`;
// 기본 홀로 카드 (기울기 a)
const holoCard=(inner='',a=-8,fill='url(#holo)')=>`<g filter="url(#sh)" transform="rotate(${a} 256 248)"><g clip-path="url(#card)">
  <rect x="136" y="80" width="240" height="336" fill="${fill}"/><rect x="136" y="80" width="240" height="336" fill="url(#lines)"/>${inner}
  <rect x="136" y="80" width="240" height="336" fill="url(#gloss)" opacity=".75"/></g>
  <rect x="136" y="80" width="240" height="336" rx="28" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4"/></g>`;
const C=[
 ['B3-1 · 해돋이','창 아래에서 주황 해가 떠오르는 모양. "새 단어가 떠오른다".',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><clipPath id="w1"><rect x="162" y="106" width="188" height="226" rx="16"/></clipPath><g clip-path="url(#w1)"><rect x="162" y="220" width="188" height="112" fill="#2a1d2c"/><circle cx="256" cy="262" r="62" fill="#FF6A2E"/><rect x="162" y="262" width="188" height="70" fill="#17151f"/><rect x="186" y="276" width="140" height="6" rx="3" fill="#FF6A2E" opacity=".6"/><rect x="206" y="292" width="100" height="6" rx="3" fill="#FF6A2E" opacity=".35"/></g><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-2 · 말풍선','주황 말풍선. 단어를 "말하고 듣는" 느낌.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><path d="M198 160h116a22 22 0 0 1 22 22v54a22 22 0 0 1-22 22h-54l-34 28v-28h-28a22 22 0 0 1-22-22v-54a22 22 0 0 1 22-22z" fill="#FF6A2E"/><circle cx="222" cy="209" r="9" fill="#17151f"/><circle cx="256" cy="209" r="9" fill="#17151f"/><circle cx="290" cy="209" r="9" fill="#17151f"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-3 · 펼친 책','주황 책이 펼쳐진 모양. 단어장이라는 뜻이 가장 분명해요.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><path d="M256 178c-26-16-58-20-86-16v118c28-4 60 0 86 16z" fill="#FF6A2E"/><path d="M256 178c26-16 58-20 86-16v118c-28-4-60 0-86 16z" fill="#FF9A66"/><path d="M256 178v118" stroke="#17151f" stroke-width="5"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-4 · 주황 별','주황 반짝이 별. 레어 카드를 뽑은 순간.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><path d="M256 150C263 210 276 212 330 219C276 226 263 228 256 288C249 228 236 226 182 219C236 212 249 210 256 150Z" fill="#FF6A2E"/><path d="M314 156C316 170 320 172 332 174C320 176 316 178 314 192C312 178 308 176 296 174C308 172 312 170 314 156Z" fill="#FFB38A"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-5 · 소리 물결','주황 음파 막대. 발음을 듣는 앱이라는 표시.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><rect x="187" y="199.0" width="18" height="40" rx="9" fill="#FF6A2E" opacity="0.55"/><rect x="217" y="177.0" width="18" height="84" rx="9" fill="#FF6A2E" opacity="0.8"/><rect x="247" y="159.0" width="18" height="120" rx="9" fill="#FF6A2E" opacity="1"/><rect x="277" y="177.0" width="18" height="84" rx="9" fill="#FF6A2E" opacity="0.8"/><rect x="307" y="199.0" width="18" height="40" rx="9" fill="#FF6A2E" opacity="0.55"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-6 · 하트','주황 하트. 포카를 아끼는 마음(덕질 감성).',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><path d="M256 284c-46-32-74-56-74-88 0-24 19-42 40-42 16 0 28 10 34 22 6-12 18-22 34-22 21 0 40 18 40 42 0 32-28 56-74 88z" fill="#FF6A2E"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-7 · 불꽃','주황 불꽃. 매일 이어 가는 연속 공부.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><path d="M256 146c10 40 58 60 58 112a58 58 0 0 1-116 0c0-30 18-46 26-66 6 20 18 26 18 26 4-30-2-50 14-72z" fill="#FF6A2E"/><path d="M256 232c6 18 26 26 26 48a26 26 0 0 1-52 0c0-16 12-24 16-36 4 8 10 12 10 12 0-12 0-16 0-24z" fill="#FFC49E"/><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)],
 ['B3-8 · 외움 도장','주황 원형 도장에 체크. "외웠다"를 찍는 순간.',
  `<rect width="512" height="512" fill="url(#night)"/><rect width="512" height="512" fill="url(#glowO)"/>`+holoCard(`<rect x="162" y="106" width="188" height="226" rx="16" fill="#17151f"/><g transform="rotate(-12 256 219)"><circle cx="256" cy="219" r="62" fill="none" stroke="#FF6A2E" stroke-width="10"/><circle cx="256" cy="219" r="48" fill="none" stroke="#FF6A2E" stroke-width="3" stroke-dasharray="6 7"/><path d="M228 220l20 20 38-42" fill="none" stroke="#FF6A2E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="162" y="350" width="110" height="14" rx="7" fill="#17151f" opacity=".7"/><rect x="162" y="374" width="64" height="12" rx="6" fill="#17151f" opacity=".45"/>`)+spark(400,122,24)]
];
const g=document.getElementById('g');
C.forEach(([t,d,s])=>{const svg=`<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="c"><h2>${t}</h2><p>${d}</p><div class="row"><div class="big">${svg}</div><div class="side"><div class="circ">${svg}</div><div class="home"><span></span>${svg}<span></span><span></span><span></span><span></span></div></div></div></div>`);});
</script></body></html>
