<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>포카보카 아이콘 후보</title>
<style>
body{margin:0;background:#2b2b30;font-family:"Malgun Gothic",sans-serif;color:#eee;padding:28px;width:1700px}
h1{font-size:26px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.c{background:#1c1c20;border-radius:18px;padding:18px}
.c h2{font-size:19px;margin:0 0 4px}.c p{font-size:13px;color:#aaa;margin:0 0 14px;line-height:1.45;height:38px}
.row{display:flex;align-items:flex-end;gap:14px}
.big svg{width:220px;height:220px;display:block;border-radius:48px;overflow:hidden}
.side{display:flex;flex-direction:column;gap:12px;align-items:center}
.circ svg{width:84px;height:84px;border-radius:50%;display:block}
.home{width:140px;height:120px;border-radius:14px;background:linear-gradient(160deg,#7a8fb8,#c9a38a);display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:8px;box-sizing:border-box}
.home span{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.35)}
.home svg{width:40px;height:40px;border-radius:11px;display:block}
</style></head><body>
<h1>포카보카 아이콘 후보 — 큰 그림 · 원형 자르기 · 홈 화면 크기</h1>
<div class="grid" id="g"></div>
<svg width="0" height="0" style="position:absolute">
<defs>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ad5"/><stop offset=".35" stop-color="#9ef0ff"/><stop offset=".65" stop-color="#fff29a"/><stop offset="1" stop-color="#c5a2ff"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A4C"/><stop offset="1" stop-color="#F0561E"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26232e"/><stop offset="1" stop-color="#141318"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8EE"/><stop offset="1" stop-color="#F3E9DA"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".47" stop-color="#fff" stop-opacity=".75"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D4BFF"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient>
  <radialGradient id="glowB" cx=".5" cy="1" r=".75"><stop offset="0" stop-color="#FF6A2E" stop-opacity=".6"/><stop offset="1" stop-color="#FF6A2E" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="shs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
</defs></svg>
<script>
const C=[
 ['A · 부채꼴 카드','카드 세 장을 부채처럼 편 모양. "모은다"가 바로 보여요. 주황 바탕.',
 `<rect width="512" height="512" fill="url(#orange)"/>
  <g filter="url(#sh)">
   <g transform="rotate(-16 256 330)"><rect x="150" y="120" width="170" height="236" rx="22" fill="#FFD9C2"/></g>
   <g transform="rotate(14 256 330)"><rect x="192" y="120" width="170" height="236" rx="22" fill="#FFE9DC"/></g>
   <g transform="rotate(-1 256 330)"><rect x="171" y="104" width="170" height="236" rx="22" fill="#fff"/>
     <text x="256" y="262" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="120" fill="#F0561E">A</text></g>
  </g>`],
 ['B · 홀로 포카','무지개빛 홀로그램 카드 한 장. 레어 카드를 뽑은 느낌.',
 `<rect width="512" height="512" fill="url(#night)"/>
  <g filter="url(#sh)" transform="rotate(-8 256 256)">
   <rect x="146" y="92" width="220" height="308" rx="26" fill="url(#holo)"/>
   <rect x="146" y="92" width="220" height="308" rx="26" fill="url(#gloss)" opacity=".8"/>
   <rect x="166" y="112" width="180" height="200" rx="14" fill="#1b1830" opacity=".9"/>
   <text x="256" y="250" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="120" fill="#fff">V</text>
   <rect x="166" y="330" width="120" height="14" rx="7" fill="#1b1830" opacity=".75"/>
   <rect x="166" y="356" width="70" height="12" rx="6" fill="#1b1830" opacity=".5"/>
  </g>
  <path d="M388 120l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#fff"/><path d="M118 360l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fff" opacity=".8"/>`],
 ['C · 뜯는 카드팩','윗부분이 톱니처럼 뜯긴 팩에서 카드가 솟는 모양. 개봉의 두근거림.',
 `<rect width="512" height="512" fill="#17161B"/>
  <g filter="url(#sh)">
   <g transform="rotate(-6 256 180)"><rect x="176" y="40" width="160" height="220" rx="18" fill="#fff"/>
     <text x="256" y="150" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="84" fill="#F0561E">Aa</text></g>
   <path d="M124 214 L148 196 L172 214 L196 196 L220 214 L244 196 L268 214 L292 196 L316 214 L340 196 L364 214 L388 196 L388 430 Q388 446 372 446 L140 446 Q124 446 124 430 Z" fill="url(#orange)"/>
   <rect x="124" y="396" width="264" height="10" fill="#fff" opacity=".25"/>
  </g>`],
 ['D · 톱로더','포카 보관용 투명 케이스(톱로더)에 든 카드 + 하트 스티커. 포카 문화 그대로.',
 `<rect width="512" height="512" fill="#FFE3D3"/>
  <g filter="url(#sh)" transform="rotate(-7 256 256)">
   <rect x="138" y="70" width="236" height="372" rx="20" fill="#ffffff" opacity=".55" stroke="#fff" stroke-width="6"/>
   <rect x="164" y="112" width="184" height="304" rx="16" fill="url(#orange)"/>
   <text x="256" y="300" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="130" fill="#fff">A</text>
   <rect x="138" y="70" width="236" height="372" rx="20" fill="url(#gloss)" opacity=".55"/>
   <path d="M322 96c10-18 36-12 36 8 0 18-24 30-36 40-12-10-36-22-36-40 0-20 26-26 36-8z" fill="#FF4F7B" stroke="#fff" stroke-width="5"/>
  </g>`],
 ['E · 단어 카드 Aa','크림색 카드에 큰 "Aa". 단어장이라는 게 가장 분명해요. 조용한 인상.',
 `<rect width="512" height="512" fill="#1D1C22"/>
  <g filter="url(#sh)" transform="rotate(-6 256 256)">
   <rect x="128" y="96" width="256" height="330" rx="28" fill="url(#cream)"/>
   <text x="256" y="300" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="150" fill="#1D1C22">Aa</text>
   <rect x="196" y="340" width="120" height="14" rx="7" fill="#F0561E"/>
  </g>`],
 ['F · 포 글자 카드','주황 카드에 한글 "포". 한국 앱 목록에서 눈에 잘 띄는 글자형.',
 `<rect width="512" height="512" fill="#FFF4EA"/>
  <g filter="url(#sh)" transform="rotate(-6 256 256)">
   <rect x="120" y="86" width="272" height="350" rx="34" fill="url(#orange)"/>
   <text x="256" y="322" text-anchor="middle" font-family="Malgun Gothic" font-weight="700" font-size="200" fill="#fff">포</text>
  </g>`],
 ['G · 반짝 수집','보라→분홍 바탕에 카드 두 장 + 반짝임. 게임·수집 앱 느낌이 가장 강해요.',
 `<rect width="512" height="512" fill="url(#violet)"/>
  <g filter="url(#sh)">
   <g transform="rotate(12 300 280)"><rect x="220" y="118" width="170" height="240" rx="20" fill="#FFD36B"/><text x="305" y="270" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="100" fill="#fff">B</text></g>
   <g transform="rotate(-10 220 280)"><rect x="120" y="140" width="180" height="252" rx="22" fill="#fff"/><text x="210" y="304" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="110" fill="#6D4BFF">A</text></g>
  </g>
  <path d="M404 96l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" fill="#fff"/><path d="M96 380l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#fff" opacity=".85"/>`],
 ['H · 지금 것 다듬기','지금 모양(기운 카드+주황 점)을 유지하되 카드를 크게, 바탕을 깔끔하게.',
 `<rect width="512" height="512" fill="url(#night)"/>
  <rect width="512" height="512" fill="url(#glowB)"/>
  <g filter="url(#sh)" transform="rotate(-10 256 256)">
   <rect x="150" y="96" width="212" height="300" rx="30" fill="#F7F3FA"/>
   <rect x="150" y="96" width="212" height="300" rx="30" fill="url(#gloss)" opacity=".5"/>
   <circle cx="256" cy="232" r="52" fill="#FF6A2E"/>
   <rect x="206" y="320" width="100" height="14" rx="7" fill="#d9d2e0"/>
  </g>`]
];
const g=document.getElementById('g');
C.forEach(([t,d,s])=>{const svg=`<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="c"><h2>${t}</h2><p>${d}</p><div class="row"><div class="big">${svg}</div><div class="side"><div class="circ">${svg}</div><div class="home"><span></span>${svg}<span></span><span></span><span></span><span></span></div></div></div></div>`);});
</script></body></html>
